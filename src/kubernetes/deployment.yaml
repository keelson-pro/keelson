apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${ProjectName}
  namespace: ${Environment}
  labels:
    kaptain.org/environment: ${Environment}
    kaptain.org/product: ${ProductName}
    kaptain.org/project-name: ${ProjectName}
    kaptain.org/version: "${Version}"
    kaptain.org/owner: ${RepositoryOwner}
    app.kubernetes.io/name: ${ProjectName}
    app.kubernetes.io/instance: ${ProjectName}
    app.kubernetes.io/version: "${Version}"
    app.kubernetes.io/managed-by: Kaptain
    app: ${ProjectName}
    app.kubernetes.io/part-of: ${ProductName}
  annotations:
    kaptain.org/source-repository: ${RepositoryOwner}/${RepositoryName}
spec:
  # Single replica + Recreate strategy: Keelson is the sole writer to keelson-state,
  # and the directory-based work queue lives on the pod filesystem.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ${ProjectName}
  template:
    metadata:
      labels:
        kaptain.org/environment: ${Environment}
        kaptain.org/product: ${ProductName}
        kaptain.org/project-name: ${ProjectName}
        kaptain.org/version: "${Version}"
        kaptain.org/owner: ${RepositoryOwner}
        app.kubernetes.io/name: ${ProjectName}
        app.kubernetes.io/instance: ${ProjectName}
        app.kubernetes.io/version: "${Version}"
        app.kubernetes.io/managed-by: Kaptain
        app: ${ProjectName}
        app.kubernetes.io/part-of: ${ProductName}
      annotations:
        kaptain.org/source-repository: ${RepositoryOwner}/${RepositoryName}
    spec:
      serviceAccountName: ${ProjectName}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ${ProjectName}
          image: ${Keelson/EnvironmentDockerRegistryAndNamespace}/keelson/keelson-package:${Keelson/PackageVersion}
          imagePullPolicy: IfNotPresent
          command: ["keelson"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: KEELSON_LOG_FORMAT
              value: "${Keelson/LogFormat}"
            - name: KEELSON_LOG_LEVEL
              value: "${Keelson/LogLevel}"
            - name: KEELSON_LOG_MANAGED_WORKLOADS
              value: "${Keelson/LogManagedWorkloads}"
            - name: KEELSON_SCOPE
              value: "${Keelson/Scope}"
            - name: KEELSON_CONFIG_MODE
              value: "${Keelson/ConfigMode}"
            - name: KEELSON_RESPECT_SA_PULL_SECRETS
              value: "${Keelson/RespectServiceAccountPullSecrets}"
            - name: KEELSON_WATCHED_KINDS
              value: "${Keelson/WatchedKinds}"
            - name: KEELSON_RECONCILE_INTERVAL
              value: "${Keelson/ReconcileInterval}"
            - name: KEELSON_REGISTRY_POLL_INTERVAL_DEFAULT
              value: "${Keelson/RegistryPollIntervalDefault}"
            - name: KEELSON_FIRST_POLL_DELAY_MAX
              value: "${Keelson/FirstPollDelayMax}"
            - name: KEELSON_REGISTRY_POLL_CONCURRENCY
              value: "${Keelson/RegistryPollConcurrency}"
            - name: KEELSON_POLL_OVERRUN_WARNING_BACKOFF_LIMIT
              value: "${Keelson/PollOverrunWarningBackoffLimit}"
            - name: KEELSON_RECONCILE_OVERRUN_WARNING_BACKOFF_LIMIT
              value: "${Keelson/ReconcileOverrunWarningBackoffLimit}"
            - name: KEELSON_FULL_REFRESH_INTERVAL
              value: "${Keelson/FullRefreshInterval}"
            - name: KEELSON_TICK_INTERVAL
              value: "${Keelson/TickInterval}"
            - name: KEELSON_HEARTBEAT_MAX_AGE
              value: "${Keelson/HeartbeatMaxAge}"
            - name: KEELSON_WATCHER_RESPAWN_BACKOFF_MAX
              value: "${Keelson/WatcherRespawnBackoffMax}"
            - name: KEELSON_WATCHER_RESPAWN_HEALTHY_RESET
              value: "${Keelson/WatcherRespawnHealthyReset}"
            - name: KEELSON_WATCHER_RECONNECT_INITIAL
              value: "${Keelson/WatcherReconnectInitial}"
            - name: KEELSON_WATCHER_RECONNECT_MAX
              value: "${Keelson/WatcherReconnectMax}"
            - name: KEELSON_WATCHER_RECONNECT_RESET
              value: "${Keelson/WatcherReconnectReset}"
            - name: KEELSON_STATE_CONFIGMAP
              value: "${Keelson/StateConfigMap}"
            - name: KEELSON_FIELD_MANAGER_STRATEGY_OWNED
              value: "${Keelson/FieldManagerStrategyOwned}"
            - name: KEELSON_FIELD_MANAGER_STRATEGY_UNOWNED
              value: "${Keelson/FieldManagerStrategyUnowned}"
            - name: KEELSON_LOG_DEBUG_REPEAT_INTERVAL
              value: "${Keelson/LogDebugRepeatInterval}"
            - name: KEELSON_LOG_INFO_REPEAT_INTERVAL
              value: "${Keelson/LogInfoRepeatInterval}"
            - name: KEELSON_LOG_WARN_REPEAT_INTERVAL
              value: "${Keelson/LogWarnRepeatInterval}"
            - name: KEELSON_LOG_ERROR_REPEAT_INTERVAL
              value: "${Keelson/LogErrorRepeatInterval}"
            - name: KEELSON_LOG_FILE_MAX_BYTES
              value: "${Keelson/LogFileMaxBytes}"
            - name: KEELSON_LOG_FILE_KEEP
              value: "${Keelson/LogFileKeep}"
          resources:
            requests:
              memory: "${Keelson/Memory}"
              cpu: "${Keelson/CpuRequest}"
              ephemeral-storage: "${Keelson/EphemeralStorage}"
            limits:
              memory: "${Keelson/Memory}"
              ephemeral-storage: "${Keelson/EphemeralStorage}"
          startupProbe:
            exec:
              command: ["keelson-probe", "startup"]
            periodSeconds: ${Keelson/StartupProbePeriodSeconds}
            failureThreshold: ${Keelson/StartupProbeFailureThreshold}
            timeoutSeconds: ${Keelson/StartupProbeTimeoutSeconds}
          readinessProbe:
            exec:
              command: ["keelson-probe", "readiness"]
            periodSeconds: ${Keelson/ReadinessProbePeriodSeconds}
            failureThreshold: ${Keelson/ReadinessProbeFailureThreshold}
            timeoutSeconds: ${Keelson/ReadinessProbeTimeoutSeconds}
          livenessProbe:
            exec:
              command: ["keelson-probe", "liveness"]
            periodSeconds: ${Keelson/LivenessProbePeriodSeconds}
            failureThreshold: ${Keelson/LivenessProbeFailureThreshold}
            timeoutSeconds: ${Keelson/LivenessProbeTimeoutSeconds}
          volumeMounts:
            - name: config
              mountPath: /configmap
              readOnly: true
            - name: work
              mountPath: /keelson/work
            - name: home
              mountPath: /home/keelson
      volumes:
        - name: config
          configMap:
            name: ${ProjectName}-configmap-checksum
            optional: true
        - name: work
          emptyDir: {}
        - name: home
          emptyDir: {}
